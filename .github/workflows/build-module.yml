name: Build Magisk Module

on:
  push:
    branches:
      - 'freeze_logd_switch'
    paths:
      - 'Source/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get module info
        id: module_info
        run: |
          MODULE_ID=$(grep -oP 'id=\K.*' Source/module.prop)
          MODULE_NAME=$(grep -oP 'name=\K.*' Source/module.prop)
          MODULE_VERSION=$(grep -oP 'version=\K.*' Source/module.prop)
          MODULE_VERSIONCODE=$(grep -oP 'versionCode=\K.*' Source/module.prop)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          REPO_NAME=${{ github.repository }}

          echo "module_id=$MODULE_ID" >> $GITHUB_OUTPUT
          echo "module_name=$MODULE_NAME" >> $GITHUB_OUTPUT
          echo "module_version=$MODULE_VERSION" >> $GITHUB_OUTPUT
          echo "module_versioncode=$MODULE_VERSIONCODE" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT

      - name: Check release tag not exists
        run: |
          TAG="v${{ steps.module_info.outputs.module_version }}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}"; then
            echo "::error::Tag ${TAG} 已存在! 若已修改代码, 请先递增 Source/module.prop 的 version/versionCode 并在 changelog 顶部新增条目"
            exit 1
          fi
          echo "Tag ${TAG} 可用"

      - name: Generate metadata (update.json / version / changelog)
        run: sh update_meta.sh github

      - name: Build module zip
        id: build
        run: |
          MODULE_ID=${{ steps.module_info.outputs.module_id }}
          MODULE_VERSION=${{ steps.module_info.outputs.module_version }}
          BRANCH_NAME=${{ steps.module_info.outputs.branch_name }}

          ZIP_NAME="${MODULE_ID}-${MODULE_VERSION}.zip"

          mkdir temp_module
          cp -r Source/* temp_module/

          # 仅打包副本使用 Gitee 更新源, 仓库内 module.prop 保持 GitHub 地址
          sed -i "s|updateJson=.*|updateJson=https://gitee.com/lucky__cat/magisk-modules/raw/freeze_logd_switch/update.json|g" temp_module/module.prop

          # 进入临时目录打包
          # 模块包必须仅存储(-0)打包、不可压缩, 否则部分安装器/恢复环境无法正确解压
          cd temp_module
          zip -r -0 "../$ZIP_NAME" ./*
          cd ..

          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Get changelog content
        id: changelog
        run: |
          CHANGELOG_CONTENT=$(cat changelog)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.module_info.outputs.module_version }}
          name: ${{ steps.module_info.outputs.module_name }} v${{ steps.module_info.outputs.module_version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: ${{ steps.build.outputs.zip_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit metadata changes
        run: |
          MODULE_VERSION=${{ steps.module_info.outputs.module_version }}
          MODULE_VERSIONCODE=${{ steps.module_info.outputs.module_versioncode }}
          BRANCH_NAME=${{ steps.module_info.outputs.branch_name }}

          # 提交元数据更改（无变更时跳过, 避免同一版本重复构建时报错）
          if git diff --quiet update.json version changelog; then
            echo "No changes to commit"
          else
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            git add update.json version changelog
            git commit -m "Update module to v${MODULE_VERSION} (${MODULE_VERSIONCODE})"
            git push origin ${BRANCH_NAME}
          fi
