name: Sync to Gitee

on:
  push:
    branches: [ freeze_logd_switch ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sleep for 30 seconds
        run: sleep 30

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: freeze_logd_switch

      - name: Configure Git
        env:
          GITEE_USER: lucky__cat
        run: |
          git config --global user.name "${GITEE_USER}"
          git config --global user.email "${GITEE_USER}@users.noreply.github.com"

      - name: Fetch all branches and tags
        run: |
          git remote set-branches origin '*'
          git fetch origin --tags --force
          echo "Current branches:"
          git branch -a

      - name: Push to Gitee
        env:
          GITEE_USER: lucky__cat
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # 添加 Gitee remote
          git remote add gitee https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/magisk-modules.git

          # 只同步 freeze_logd_switch 分支
          git checkout freeze_logd_switch

          # 生成 Gitee 版本元数据（update.json/version/changelog, 单一来源脚本）
          sh update_meta.sh gitee

          # 提交 Gitee 版本元数据
          git add update.json version changelog
          git commit -m "Update URLs to Gitee links" || true

          # 只推送 freeze_logd_switch 分支到 Gitee
          git push gitee freeze_logd_switch:freeze_logd_switch --force

          # 推送相关标签
          git push gitee --tags --force
          echo "Push completed"

      - name: Sync Latest Release to Gitee
        env:
          GITEE_USER: lucky__cat
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 构建流程可能尚未创建 Release, 最多等待 5 分钟
          current_release=""
          for i in $(seq 1 30); do
            latest_release=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases")
            # 取第一个含 freeze_logd 资产的 release（数组写法, 避免 jq|head 的 broken pipe）
            current_release=$(echo "$latest_release" | jq -c '[.[] | select(any(.assets[]; .name | contains("freeze_logd")))] | .[0]' 2>/dev/null || true)
            [ -n "$current_release" ] && [ "$current_release" != "null" ] && break
            echo "Release not ready, retry $i/30..."
            sleep 10
          done

          if [ -z "$current_release" ] || [ "$current_release" = "null" ]; then
            echo "No release found for freeze_logd_switch branch"
            exit 0
          fi

          RELEASE_TAG=$(echo "$current_release" | jq -r '.tag_name')
          RELEASE_NAME=$(echo "$current_release" | jq -r '.name')
          RELEASE_BODY=$(echo "$current_release" | jq -r '.body')
          RELEASE_BODY="${RELEASE_BODY:-"从 GitHub 同步的发行版 ${RELEASE_TAG}"}"
          TARGET_COMMIT=$(git rev-parse HEAD)

          echo "Processing release: $RELEASE_TAG"

          # 下载发行版附件
          mkdir -p "release_assets"
          cd "release_assets"

          echo "$current_release" | jq -r '.assets[].browser_download_url' | while read -r url; do
            if [ -n "$url" ] && echo "$url" | grep -q "freeze_logd"; then
              echo "Downloading asset: $url"
              filename=$(basename "$url")
              curl -sL -H "Authorization: token $GH_TOKEN" -o "$filename" "$url"
              if [ -s "$filename" ]; then
                echo "Downloaded: $filename"
              else
                echo "::warning::资产下载失败或为空: $filename"
              fi
            fi
          done

          cd ..

          API="https://gitee.com/api/v5/repos/${GITEE_USER}/magisk-modules/releases"

          # 确保 tag 已存在于 Gitee（本地可能尚未持有该 tag, 先取回再推送）
          if ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            git fetch origin "refs/tags/${RELEASE_TAG}" 2>/dev/null || true
          fi
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            git push gitee "refs/tags/${RELEASE_TAG}" 2>/dev/null || true
          fi

          # 幂等: tag 已有 release 则复用, 否则创建
          release_id=$(curl -s "${API}/tags/${RELEASE_TAG}?access_token=${GITEE_TOKEN}" | jq -r '.id // empty' 2>/dev/null || true)
          if [ -n "$release_id" ]; then
            echo "Gitee release ${RELEASE_TAG} 已存在, 复用 id=${release_id}"
          else
            echo "Creating Gitee release: $RELEASE_TAG"
            # 用 jq 构造请求体, 自动转义 body 中的引号/换行
            payload=$(jq -n \
              --arg access_token "$GITEE_TOKEN" \
              --arg tag_name "$RELEASE_TAG" \
              --arg name "$RELEASE_NAME" \
              --arg body "$RELEASE_BODY" \
              --arg target "$TARGET_COMMIT" \
              '{access_token: $access_token, tag_name: $tag_name, name: $name, body: $body, prerelease: false, target_commitish: $target}')
            response=$(curl -s -X POST -H "Content-Type: application/json;charset=UTF-8" \
              -d "$payload" "${API}")
            release_id=$(echo "$response" | jq -r '.id // empty' 2>/dev/null || true)
            if [ -z "$release_id" ]; then
              echo "::error::Gitee release 创建失败: $response"
              exit 1
            fi
            echo "Gitee release created: id=${release_id}"
          fi

          # 上传所有文件
          cd "release_assets"
          for file in *; do
            if [ -f "$file" ]; then
              echo "Uploading: $file"
              upload_response=$(curl -s -X POST \
                -H "Content-Type: multipart/form-data" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "file=@${file}" \
                "${API}/${release_id}/attach_files")
              echo "Upload response: $upload_response"
              sleep 2
            fi
          done
          cd ..
          rm -rf "release_assets"
          echo "Completed release sync"
